<!DOCTYPE html>

<!-- 
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
        
    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Chris Dehghanpoor</title>
    <link rel="icon" type="image/x-icon" href="/images/avatar.png"> <!-- Update this with your own favicon -->
    
    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Chris Dehghanpoor, investigative reporter for The Washington Post, specializing in OSINT.">
    
    <!-- Keywords -->
    <meta name="keywords" content="chris dehghanpoor, reporter, the washington post">
    
    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://ckd.sh">
    
    <!-- Author Information -->
    <meta name="author" content="Chris Dehghanpoor">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N993QTDP29"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-N993QTDP29');
    </script>

  
    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended. 
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">

            <!-- 
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="LittleLink">

            <!-- Replace with your name or brand -->
            <h1>
              <div>Chris<br>Dehghanpoor</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>Investigative Reporter @ The Washington Post</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

              <!-- WaPo Author Page -->
              <a class="button button-wapo-author-page" href="https://www.washingtonpost.com/people/chris-dehghanpoor/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/wp.svg" alt="WaPo Author Page icon">WaPo Author Page</a>

              <!-- WaPo Email -->
              <a class="button button-wapo-author-page" href="mailto:chris.dehghanpoor@washpost.com" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/wp.svg" alt="WaPo Author Page icon">WaPo Email</a>

              <!-- Signal -->
              <a class="button button-signal" href="https://signal.me/#eu/TTIhcFEi0asdmMYTEJfr0ZY00dJiLYY4Zl-818E-s8Yl606-94FPK6NB9mqkVOP8" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/signal.svg" alt="Signal Logo">Signal</a>

              <!-- chrisd9r@protonmail.com -->
              <a class="button button-chrisd9r-pm-me" href="mailto:chrisd9r@pm.me" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/protonmail.svg" alt="chrisd9r@pm.me icon">ProtonMail</a>

              <!-- Telegram -->
              <a class="button button-telegram" href="https://t.me/chrisd9r" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/telegram.svg" alt="Telegram Logo">Telegram</a>

              <!-- X -->
              <a class="button button-x" href="https://x.com/chrisd9r" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/x.svg" alt="X Logo">Follow on X</a>
   
              <!-- Bluesky -->
              <a class="button button-bluesky" href="https://bsky.app/profile/chrisd9r.bsky.social" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/bluesky.svg" alt="Bluesky Logo">Bluesky</a>

              <!-- LinkedIn -->
              <a class="button button-linked" href="https://www.linkedin.com/in/chrisdehghanpoor/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/linkedin.svg" alt="LinkedIn Logo">LinkedIn</a>

              <!-- GitHub -->
              <a class="button button-github" href="https://github.com/chriskd" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/github.svg" alt="GitHub Logo">GitHub</a>

              <!-- PGP Key -->
              <a class="button button-pgp-key" href="#" id="pgp-key-button" role="button"><img class="icon" aria-hidden="true" src="images/icons/pgp.svg" alt="PGP Key icon">PGP Key</a>

      </div>
    
    </div>
  </div>

  <!-- PGP Key Modal -->
  <div id="pgp-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>PGP Key</h2>
      
      <div class="pgp-section">
        <h3>Signed Message</h3>
        <div class="copy-container">
          <pre id="signed-message" class="pgp-text"></pre>
          <button class="copy-button" data-target="signed-message">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg> Copy
          </button>
        </div>
      </div>
      
      <div class="pgp-section">
        <h3>Public Key</h3>
        <div class="copy-container">
          <pre id="public-key" class="pgp-text"></pre>
          <button class="copy-button" data-target="public-key">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg> Copy
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript files -->
  <script src="js/pgp-content.js"></script>
  <script src="js/pgp-modal.js"></script>
</body>

</html>
